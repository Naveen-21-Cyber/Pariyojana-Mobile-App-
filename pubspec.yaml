name: velvet
description: "PARIYOJANA — Sovereign Focus & Productivity Vault"
publish_to: 'none'

version: 1.2.1+12

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.18.0

  # State management & architecture
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0

  # Local storage (encrypted, offline-first)
  drift: ^2.22.1
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.4
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  printing: ^5.13.3

  # Auth & Firebase (Crashlytics + Core, Zero Ad-Network SDKs)
  local_auth: ^2.3.0
  google_sign_in: ^6.2.2
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.3
  vector_math: ^2.1.4

  # Crypto
  pointycastle: ^3.9.1
  cryptography: ^2.7.0
  encrypt: ^5.0.3

  # Networking
  dio: ^5.7.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1

  # In-app OTA update
  open_file: ^3.3.2
  package_info_plus: ^8.0.0

  # UI / motion / glass-clay-skeuomorphic system
  flutter_animate: ^4.5.2
  rive: ^0.13.20
  glassmorphism: ^3.0.0
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  fl_chart: ^0.70.0
  qr_flutter: ^4.1.0
  percent_indicator: ^4.2.4
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Notifications & background work
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.6.0
  workmanager: ^0.6.0


  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  device_info_plus: ^11.2.0
  flutter_dotenv: ^5.2.1
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  timezone: ^0.10.1
  translator: ^1.0.4+1
  flutter_timezone: ^5.1.0
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  share_plus: ^10.1.3

  crypto: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    # NOTE: .env is intentionally NOT listed here — it must never be bundled
    # inside the APK (C1 security fix). All runtime keys use flutter_secure_storage.
    - assets/branding/
    - assets/animations/
    - assets/sounds/
    - assets/sounds/songs/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#FFF8F2"
  adaptive_icon_foreground: "assets/branding/app_icon.png"